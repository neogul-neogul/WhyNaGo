spring:
  application:
    name: whynago

  datasource:
    url: jdbc:h2:mem:ibid;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

  ai:
    model:
      # openai·ollama 스타터가 둘 다 클래스패스에 있어 아무것도 고르지 않으면 ChatModel 빈이 둘이 된다.
      # 운영이 프로파일로 하나를 고르는 것과 같은 방식으로 테스트도 한쪽을 지정한다.
      chat: openai
      embedding: none
    openai:
      api-key: test-key

  mail:
    host: localhost
    port: 2500
    username: test@example.com
    password: test-password

google:
  client-id: test-client-id

jwt:
  secret: ${JWT_SECRET:local-access-secret-change-me-0123456789}
  access:
    expiration: 1800000
  refresh:
    expiration: 604800000
    grace-period: 10000

mail:
  from: test@example.com
