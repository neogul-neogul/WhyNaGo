# AI_PROVIDER로 어떤 AI 설정을 쓸지 고른다. 기본은 Gemini(local), AI_PROVIDER=ollama 면 로컬 ollama.
spring:
  config:
    import:
      - classpath:config/application-db-local.yml
      - classpath:config/application-ai-${AI_PROVIDER:local}.yml
      - classpath:config/application-email-local.yml

jwt:
  secret: ${JWT_SECRET:"local-dev-secret-not-a-real-secret-0123456789}
  access:
    expiration: 180000000
  refresh:
    expiration: 604800000

google:
  client-id: ${GOOGLE_CLIENT_ID:google-client-id}
