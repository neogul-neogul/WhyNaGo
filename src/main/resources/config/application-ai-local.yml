spring:
  ai:
    model:
      embedding: none
    openai:
      api-key: ${API_KEY:dummy-local-dev-key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash
          temperature: 0.7
          reasoning-effort: low
