# DB 접속 정보는 환경변수로 주입한다 (deploy/.env 참고). 시크릿을 파일에 직접 적지 않는다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # create-drop을 반드시 덮어써야 한다.
      # create-drop이면 컨테이너 재시작마다 테이블이 drop되어 데이터가 전부 사라진다.
      #
      # 최초 배포 시에는 DB가 비어 있어 스키마 생성이 필요하므로 update로 둔다.
      # 스키마가 안정되면 validate로 내리는 것을 권장한다
      # (validate는 스키마를 변경하지 않고 엔티티와 일치하는지만 검증한다).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      # data.sql은 로컬 전용 시드이므로 운영에서는 실행하지 않는다.
      mode: never
