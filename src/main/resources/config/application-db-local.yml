spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:whynago;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true

  sql:
    init:
      mode: always
      # tag 사전이 먼저 들어가야 data3.sql의 question_tag가 tag_id를 해석할 수 있다.
      data-locations: classpath:data-tag.sql,classpath:data.sql,classpath:data3.sql
