# API_KEY는 환경변수로 주입한다 (deploy/.env 참고).
spring:
  ai:
    model:
      embedding: none
    openai:
      api-key: ${API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash-lite
          temperature: 0.3
          reasoning-effort: medium
