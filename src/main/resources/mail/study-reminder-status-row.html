<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #ecece8;border-radius:13px;margin-bottom:10px;">
  <tr>
    <td style="padding:16px 18px;">
      <span style="font-size:14px;font-weight:600;color:#1c1c1a;">{{title}}</span><br/>
      <span style="font-size:12px;color:#9a9a90;">{{description}}</span>
    </td>
    <td align="right" style="padding:16px 18px;white-space:nowrap;">
      <span style="display:inline-block;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:{{badgeBg}};color:{{badgeColor}};">{{badgeLabel}}</span>
    </td>
  </tr>
</table>
