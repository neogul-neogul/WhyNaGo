spring:
  application:
    name: whynago

  datasource:
    url: ${DB_URL:jdbc:h2:mem:whynago;}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

  sql:
    init:
      mode: never

  ai:
    model:
      embedding: none
    openai:
      api-key: ${API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash
          temperature: 0.7
          reasoning-effort: low

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 1800000
  refresh:
    expiration: 604800000
    grace-period: 10000

mail:
  from: ${MAIL_FROM}

# spring-boot-starter-mail + actuator가 함께 있으면 /actuator/health가 실제 SMTP 커넥션을
# 테스트한다. 메일 서버 문제로 앱 전체 헬스체크가 죽는 것을 막는다.
management:
  health:
    mail:
      enabled: false
