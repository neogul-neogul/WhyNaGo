spring:
  application:
    name: whynago

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 1800000
  refresh:
    expiration: 604800000
    grace-period: 10000

# spring-boot-starter-mail + actuator가 함께 있으면 /actuator/health가 실제 SMTP 커넥션을
# 테스트한다. 메일 서버 문제로 앱 전체 헬스체크가 죽는 것을 막는다.
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus
