# 운영 프로파일. application.yml 의 값 중 운영에 위험한 항목만 덮어쓴다.
# DB·AI·메일 접속 정보는 config/application-{db,ai,email}-prod.yml 에서 관리한다 (deploy/.env 참고).

spring:
  config:
    import:
      - classpath:config/application-db-prod.yml
      - classpath:config/application-ai-prod.yml
      - classpath:config/application-email-prod.yml

server:
  # 배포 시 진행 중인 요청을 끝까지 처리하고 종료한다.
  shutdown: graceful
  tomcat:
    threads:
      # 기본값 200은 t3.micro(1GiB)에서 스레드 스택만으로 메모리를 크게 잡는다.
      max: 50
    max-connections: 200

management:
  endpoints:
    web:
      exposure:
        # 배포 검증에 필요한 health 만 노출한다. env/beans/mappings 등은 내부 구조를 드러낸다.
        include: health, prometheus
  endpoint:
    health:
      # {"status":"UP"} 만 응답한다. 컴포넌트별 상세(DB 종류·디스크 용량 등)는 숨긴다.
      show-details: never
      show-components: never

logging:
  level:
    root: info
    com.neogul.whynago: info
