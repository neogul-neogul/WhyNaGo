# 운영 프로파일. application.yml 의 값 중 운영에 위험한 항목만 덮어쓴다.
# DB 접속 정보·시크릿은 application.yml 이 이미 환경변수를 읽으므로 여기서 다루지 않는다
# (deploy/.env 참고).

spring:
  jpa:
    hibernate:
      # application.yml 의 create-drop 을 반드시 덮어써야 한다.
      # create-drop 이면 컨테이너 재시작마다 테이블이 drop 되어 데이터가 전부 사라진다.
      #
      # 최초 배포 시에는 DB가 비어 있어 스키마 생성이 필요하므로 update 로 둔다.
      # 스키마가 안정되면 validate 로 내리는 것을 권장한다
      # (validate 는 스키마를 변경하지 않고 엔티티와 일치하는지만 검증한다).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      # data.sql 은 로컬 전용 시드이므로 운영에서는 실행하지 않는다.
      mode: never

server:
  # 배포 시 진행 중인 요청을 끝까지 처리하고 종료한다.
  shutdown: graceful
  tomcat:
    threads:
      # 기본값 200은 t3.micro(1GiB)에서 스레드 스택만으로 메모리를 크게 잡는다.
      max: 50
    max-connections: 200

management:
  endpoints:
    web:
      exposure:
        # 배포 검증에 필요한 health 만 노출한다. env/beans/mappings 등은 내부 구조를 드러낸다.
        include: health, prometheus
  endpoint:
    health:
      # {"status":"UP"} 만 응답한다. 컴포넌트별 상세(DB 종류·디스크 용량 등)는 숨긴다.
      show-details: never
      show-components: never

logging:
  level:
    root: info
    com.neogul.whynago: info
