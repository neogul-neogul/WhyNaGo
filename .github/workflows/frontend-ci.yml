name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'front/**'
      - '!front/**.md'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'front/**'
      - '!front/**.md'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: front

jobs:
  build:
    name: 린트, 타입 검사, 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 빌드
        run: npm run build
