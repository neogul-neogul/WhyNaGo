plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.neogul'
version = '0.0.1-SNAPSHOT'
description = 'whynago'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'

    // 배포 검증용 헬스체크(/actuator/health). nginx가 /health 로 프록시한다(deploy/nginx.conf).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Spring AI — 운영은 Gemini(OpenAI 호환), 로컬은 Ollama를 사용한다.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    // 구글 소셜 로그인 — id_token의 서명·aud·iss·exp 검증
    implementation 'com.google.api-client:google-api-client:2.7.0'
    // 공용 이메일 발송 (common/mail)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    //jjwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'io.rest-assured:spring-mock-mvc'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.8"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        // 실제 모델을 호출하는 프롬프트 평가는 명시적으로 실행할 때만 돌린다.
        excludeTags 'prompt-evaluation'
    }
}

// v6 이후 서술형 채점 프롬프트를 같은 골든셋으로 비교하는 수동 평가 태스크다.
// Ollama가 떠 있어야 하며, 결과는 프로젝트의 docs/prompt-evaluations/에 새 파일로 기록한다.
tasks.register('promptEvaluation', Test) {
    group = 'verification'
    description = 'Runs the opt-in Ollama-backed essay prompt evaluation and updates its Markdown report.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'prompt-evaluation'
    }
    systemProperty 'spring.profiles.active', 'ai-local'
    // Gradle Test worker의 작업 디렉터리는 프로젝트 루트가 아닐 수 있어 절대 경로를 전달한다.
    systemProperty 'prompt.evaluation.report.dir', layout.projectDirectory.dir('docs/prompt-evaluations').asFile.absolutePath
    // 비교할 프롬프트 쌍을 고른다: ./gradlew promptEvaluation -Pcomparison=v6-v8
    systemProperty 'prompt.evaluation.comparison', providers.gradleProperty('comparison').getOrElse('v7-v8')
    // 같은 쌍을 다시 돌려도 이전 실행 결과가 캐시로 재사용되지 않게 한다.
    outputs.upToDateWhen { false }
}

// 산출물 이름을 app.jar 로 고정
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
