# 지시가 바뀌면 올린다. 오타·줄바꿈 정리는 올리지 않는다 — 그건 hash 가 가른다.
# 백엔드 채점 프롬프트(EssayPromptV*.version)와 같은 표기를 쓴다.
version: v1

generate: |
  너는 신입 웹 개발자 대상 학습 서비스의 서술형 문항 출제자다.
  아래 주제 태그로 난이도 %s의 서술형 문항을 만들어라.

  [주제 태그]
  %s

  난이도 기준
  - LOW: 핵심 개념 한두 개를 알면 답할 수 있다
  - MEDIUM: 개념에 더해 이유와 동작 방식을 물어야 한다
  - HIGH: 트레이드오프나 상황별 판단을 물어야 한다

  규칙
  - 발문은 태그 범위 안에서 하나의 초점을 파고든다. 범위 밖으로 나가지 마라.
  - **아래 [이미 있는 주제] 와 같은 것을 묻지 마라.** 표현만 바꾼 문항은 반려된다.
  - content는 '~를 설명하시오.' 형태의 발문 한 문장으로 쓴다. 두 가지를 묻되 한 문장에 담아라.
  - explanation은 그 발문의 모범답안이다. 발문이 요구한 것을 빠짐없이 담고 **250~430자**로 쓴다.
    250자에 못 미치면 반려된다. 이 해설이 채점 기준이 되므로 모호하면 채점 일관성이 깨진다.
  - explanation은 '~합니다', '~습니다' 존댓말로 쓴다.
  - tags는 1~3개다. 첫 번째는 반드시 '%s'로 두고, 더 붙일 것이 있으면
    [태그 후보] 에서만 고른다. 목록에 없는 표현을 새로 만들지 마라.

  [태그 후보]
  %s

  JSON만 출력한다. 코드펜스도 설명도 붙이지 마라.
  {"title": "...", "content": "...", "explanation": "...", "tags": ["...", "..."]}

existing: |

  [이미 문항이 있는 주제]
  아래 주제는 이 카테고리에 이미 있다. **이 주제들과 겹치지 않는 것**을 골라라.
  표현만 바꿔서 같은 것을 묻는 문항은 만들지 마라.
  %s

generateRetry: |

  이전 시도는 아래 이유로 폐기됐다. 같은 실수를 반복하지 마라.
  %s

rubric: |
  너는 서술형 문항의 채점 기준(루브릭)을 만드는 사람이다.

  [문항]
  발문: %s
  정답 해설: %s
  태그: %s

  criteria는 답변이 담아야 할 내용을 항목으로 쪼갠 것이다.
  - 3~5개로 나눈다
  - weight 합은 반드시 정확히 10이다
  - 각 항목은 위 정답 해설에 실제로 있는 내용이어야 한다. 해설에 없는 걸 요구하지 마라
  - point는 채점자가 O/X를 판단할 수 있게 구체적으로 쓴다
  - point는 서술문으로 쓴다. '~했는가?' 같은 의문문으로 쓰지 마라
  - point는 정답 해설의 표현을 최대한 그대로 가져다 쓴다. 다른 말로 바꾸지 마라

  followupScope는 정답표가 아니라 꼬리질문 가드레일이다.
  - allowed: 이 문항에서 한 단계 더 들어가도 되는 개념 3~6개
  - forbidden: 신입 수준을 넘어서는 영역 2개. 내부 구현 세부사항이나 계층 구조를 요구하는 것

  JSON만 출력한다. 코드펜스도 설명도 붙이지 마라.
  {"criteria": [{"point": "...", "weight": 3}], "followupScope": {"allowed": ["..."], "forbidden": ["..."]}}

rubricRetry: |

  이전 루브릭은 아래 이유로 반려됐다. 그 지점을 고쳐서 다시 만들어라.
  %s

generateRetryTags: |

  태그 때문에 이미 폐기됐다. 이번에는 tags 에 주제 태그 하나만 넣어라 - ["%s"].
  관련 태그는 붙이지 마라. 사전에 없는 표현을 만드는 것보다 하나만 쓰는 편이 낫다.
