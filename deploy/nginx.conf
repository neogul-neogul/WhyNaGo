upstream whynago_app {
    server app:8080;
}

server {
    listen 80;
    server_name whynago.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name whynago.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/whynago.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whynago.kro.kr/privkey.pem;

    client_max_body_size 10M;

    # 서술형 채점·꼬리질문 생성은 Gemini 응답을 동기로 기다린다(GeminiEssayAiClient).
    # 기본값 60s로는 부족할 수 있어 여유를 둔다.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # JSON 응답 압축
    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;
    gzip_proxied      any;

    location /api/ {
        proxy_pass http://whynago_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 배포 검증용. app 의 /actuator/health 로 프록시한다.
    #
    # nginx 가 직접 200 을 반환하면 app 이 죽어 있어도 통과하므로
    # CD 의 배포 성공 판정 근거로 쓸 수 없다. 반드시 app 까지 요청이 도달해야 한다.
    # app 다운 → 502, 기동 중 → 503, DB 끊김 → 503 {"status":"DOWN"}.
    location = /health {
        access_log off;
        proxy_pass http://whynago_app/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 서버 블록의 120s 를 덮어쓴다.
        # 앱이 멈춰 있을 때 CD 가 2분씩 기다리지 않고 빠르게 실패해야 한다.
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    location / {
        return 404;
    }
}
