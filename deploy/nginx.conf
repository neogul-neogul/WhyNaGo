upstream whynago_app {
    server app:8080;
}

server {
    listen 80;
    server_name whynago.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name whynago.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/whynago.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whynago.kro.kr/privkey.pem;

    client_max_body_size 10M;

    # 서술형 채점·꼬리질문 생성은 Gemini 응답을 동기로 기다린다(GeminiEssayAiClient).
    # 기본값 60s로는 부족할 수 있어 여유를 둔다.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # JSON 응답 압축
    gzip              on;
    gzip_types        application/json;
    gzip_min_length   1024;
    gzip_proxied      any;

    location /api/ {
        proxy_pass http://whynago_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
