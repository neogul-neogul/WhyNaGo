# EC2 단일 인스턴스에 nginx / app / mysql 3개 컨테이너를 띄운다.
#
# 외부로 열리는 포트는 nginx의 80뿐이다.
# app(8080)과 db(3306)은 도커 내부 네트워크에서만 접근 가능하므로
# EC2 보안그룹에는 22/80/443만 열어두면 된다.
#
# 실행: deploy/ 디렉터리에서 `docker compose up -d --build`

services:
  db:
    image: mysql:8.0
    container_name: whynago-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 앱과 DB가 같은 계정을 쓰도록 .env의 DB_* 값을 재사용한다(값 중복 방지).
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      # 1GiB 인스턴스용 메모리 절감 설정.
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - ./mysql-conf/charset.cnf:/etc/mysql/conf.d/charset.cnf
      # named volume. 컨테이너를 지우고 다시 만들어도 데이터가 유지된다.
      # 단 `docker compose down -v` 의 -v를 붙이면 볼륨째로 삭제된다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # app이 MySQL 준비 전에 떠서 커넥션 실패로 죽는 것을 막는다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whynago-app
    container_name: whynago-app
    restart: unless-stopped
    env_file: .env
    expose:
      # 호스트 바인딩 없음. nginx가 도커 네트워크로 app:8080에 접근한다.
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: whynago-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-conf:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: whynago-certbot
    restart: unless-stopped
    volumes:
      - ./certbot-conf:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

volumes:
  mysql-data:
